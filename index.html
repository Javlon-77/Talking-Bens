<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Talking Dog Demo</title>

<style>

body{
margin:0;
background:#222;
overflow:hidden;
font-family:Arial;
}

canvas{
display:block;
}

#ui{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
}

button{

padding:15px 25px;
margin:8px;
font-size:18px;
border:none;
border-radius:12px;
cursor:pointer;

}

#text{

position:absolute;
top:20px;
width:100%;
text-align:center;
font-size:32px;
color:white;

}

</style>

</head>

<body>

<div id="text">Talking Dog</div>

<div id="ui">

<button onclick="talk()">🎤 Talk</button>

<button onclick="yes()">👍 Yes</button>

<button onclick="no()">👎 No</button>

<button onclick="laugh()">😂 Laugh</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x444444);

const camera=new THREE.PerspectiveCamera(
70,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.z=5;

const renderer=new THREE.WebGLRenderer({antialias:true});

renderer.setSize(window.innerWidth,window.innerHeight);

document.body.appendChild(renderer.domElement);

const light=new THREE.DirectionalLight(0xffffff,2);

light.position.set(3,5,5);

scene.add(light);

const ambient=new THREE.AmbientLight(0xffffff,1);

scene.add(ambient);

// Body

const body=new THREE.Mesh(

new THREE.BoxGeometry(1.8,2,1),

new THREE.MeshStandardMaterial({color:0x8b5a2b})

);

scene.add(body);

// Head

const head=new THREE.Mesh(

new THREE.BoxGeometry(1.5,1.4,1.4),

new THREE.MeshStandardMaterial({color:0xa66a3d})

);

head.position.y=1.8;

scene.add(head);

// Nose

const nose=new THREE.Mesh(

new THREE.BoxGeometry(.3,.2,.5),

new THREE.MeshStandardMaterial({color:0x111111})

);

nose.position.set(0,1.6,.9);

scene.add(nose);

// Eyes

function eye(x){

const e=new THREE.Mesh(

new THREE.SphereGeometry(.09),

new THREE.MeshStandardMaterial({color:0xffffff})

);

e.position.set(x,2,.72);

scene.add(e);

}

eye(-.3);

eye(.3);

let talking=false;

let speed=0;

function speak(text){

document.getElementById("text").innerHTML=text;

const u=new SpeechSynthesisUtterance(text);

speechSynthesis.speak(u);

}

function talk(){

const words=[

"Hello!",

"How are you?",

"I am happy.",

"Nice to meet you.",

"Woof!"

];

const t=words[Math.floor(Math.random()*words.length)];

talking=true;

speed=.1;

speak(t);

}

function yes(){

talking=true;

speed=.15;

speak("Yes");

}

function no(){

talking=true;

speed=.15;

speak("No");

}

function laugh(){

talking=true;

speed=.2;

speak("Ha ha ha");

}

function animate(){

requestAnimationFrame(animate);

body.rotation.y+=0.003;

head.rotation.y+=0.003;

if(talking){

nose.position.z=.9+Math.sin(Date.now()*speed)*0.15;

}else{

nose.position.z=.9;

}

renderer.render(scene,camera);

}

speechSynthesis.onvoiceschanged=function(){};

window.speechSynthesis.addEventListener("end",()=>{

talking=false;

});

animate();

</script>

</body>
</html>
