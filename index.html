let memory = {
    name: "",
    facts: []
};


// AI javob funksiyasi

function dogAI(question){

    question =
    question.toLowerCase();


    let answer="";


    if(question.includes("ismim")){

        let name =
        question.replace("ismim","")
        .trim();


        memory.name=name;


        answer =
        "Yaxshi, eslab qolaman. Sening isming "+name;

    }


    else if(question.includes("men haqimda")){

        answer =
        "Men eslab qolgan narsalar: "
        +
        memory.facts.join(", ");

    }


    else if(question.includes("salom")){

        if(memory.name){

            answer =
            "Salom "+memory.name+
            "! Yana ko'rishganimdan xursandman.";

        }

        else{

            answer =
            "Salom! Men aqlli itman.";

        }

    }


    else if(question.includes("qandaysan")){

        answer =
        "Men yaxshi ishlayapman!";

    }


    else if(question.includes("hazil")){

        answer =
        "Itlar internetga kirsa, suyak emas WiFi qidiradi!";

    }


    else{

        answer =
        "Bu haqida hali o'rganmaganman, lekin eslab qolishim mumkin.";

        memory.facts.push(question);

    }


    return answer;

}

// LIP SYNC SYSTEM
// =============================

let audioContext;
let analyser;
let dataArray;


export function startLipSync(audio){

    audioContext =
    new AudioContext();


    const source =
    audioContext
    .createMediaElementSource(audio);


    analyser =
    audioContext
    .createAnalyser();


    analyser.fftSize=256;


    source.connect(analyser);

    analyser.connect(
        audioContext.destination
    );


    dataArray =
    new Uint8Array(
        analyser.frequencyBinCount
    );

}



export function animateMouth(dog){


if(!dog || !analyser)
return;



analyser.getByteFrequencyData(
    dataArray
);



let volume=0;


for(let i=0;i<dataArray.length;i++){

volume+=dataArray[i];

}


volume/=dataArray.length;



let open =
volume/100;



dog.traverse(
child=>{


if(child.name==="Mouth"){


child.scale.y =
0.2 + open;


}


});


}

  async function login(){

).value;

).value;

await fetch(
