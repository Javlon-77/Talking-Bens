<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking Ben Va Kimyoviy Laboratoriya (To'liq Ishchi Versiya)</title>
    <style>
        :root {
            --bg-home: #f3e9dc;
            --bg-lab: #2c3e50;
            --primary-color: #5c4033;
            --accent-color: #e67e22;
            --text-color: #333;
            --card-bg: #ffffff;
            --danger-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: var(--bg-home);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 15px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden;
            text-align: center;
            padding: 25px 20px;
            position: relative;
            transition: all 0.5s ease;
            border: 6px solid var(--primary-color);
        }

        /* Laboratoriya rejimi stili */
        .game-card.lab-mode {
            background: #34495e;
            border-color: #16a085;
            color: white;
        }
        .game-card.lab-mode h2, .game-card.lab-mode p {
            color: #ecf0f1 !important;
        }

        /* Ben Personaji chizmasi */
        .ben-avatar-container {
            width: 160px;
            height: 160px;
            margin: 15px auto;
            background: #cd853f;
            border-radius: 50%;
            border: 6px solid var(--primary-color);
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
        }

        .game-card.lab-mode .ben-avatar-container {
            background: #b8860b;
            border-color: #16a085;
        }

        .ben-face { width: 100%; height: 100%; position: relative; }
        .ben-ear { width: 35px; height: 55px; background: var(--primary-color); position: absolute; top: -10px; border-radius: 20px; }
        .ben-ear.left { left: 10px; transform: rotate(-15deg); }
        .ben-ear.right { right: 10px; transform: rotate(15deg); }
        
        .ben-eye { width: 28px; height: 40px; background: white; border-radius: 50%; position: absolute; top: 45px; display: flex; align-items: center; justify-content: center; border: 2px solid #333; }
        .ben-eye.left { left: 40px; }
        .ben-eye.right { right: 42px; }
        .ben-pupil { width: 12px; height: 12px; background: #222; border-radius: 50%; transition: transform 0.05s ease; }
        
        .ben-nose { width: 26px; height: 18px; background: #111; border-radius: 10px; position: absolute; top: 85px; left: 50%; transform: translateX(-50%); }
        .ben-mouth { width: 55px; height: 12px; background: #660000; border-radius: 0 0 25px 25px; position: absolute; top: 115px; left: 50%; transform: translateX(-50%); transition: all 0.1s ease; }

        /* Animatsiyalar */
        .ben-mouth.talking { height: 30px; animation: chew 0.15s infinite alternate; }
        @keyframes chew { 0% { height: 12px; } 100% { height: 30px; } }
        .ben-avatar-container.shaking { animation: shake 0.2s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        /* Dialog Oynasi */
        .bubble-chat {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 12px;
            margin: 15px 0;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
            border: 3px solid #e0e0e0;
        }
        .game-card.lab-mode .bubble-chat {
            background: #2c3e50;
            color: #2ecc71;
            border-color: #16a085;
        }

        /* Laboratoriya idishlari */
        .lab-flask-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
            padding: 10px;
            background: rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        .flask {
            width: 45px;
            height: 55px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }
        .flask:hover { transform: scale(1.15) rotate(10deg); }
        
        /* Tugmalar va Elementlar */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 10px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-accent { background: var(--accent-color); }
        .btn-lab { background: #16a085; }

        .game-card.lab-mode .btn:not(.btn-lab) {
            background: #7f8c8d;
        }

        .input-box {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .input-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 15px;
            font-size: 15px;
            outline: none;
        }
        .game-card.lab-mode .input-box input {
            background: #2c3e50;
            color: white;
            border-color: #16a085;
        }

        /* Admin Panel */
        .admin-card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            max-width: 550px;
            display: none;
            border: 4px solid var(--accent-color);
        }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .stat-box { background: #f8f9fa; padding: 10px; border-radius: 10px; text-align: center; border-bottom: 3px solid var(--accent-color); }
        .word-list { max-height: 140px; overflow-y: auto; background: #eee; padding: 10px; list-style: none; border-radius: 10px; text-align: left; }
        .word-item { display: flex; justify-content: space-between; padding: 6px; background: white; margin-bottom: 5px; border-radius: 5px; font-size: 14px; }
        .btn-delete { background: var(--danger-color); color: white; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <!-- BOSH SAHIFA (BEN VA LABORATORIYA) -->
        <div id="gameView" class="game-card">
            <h2 id="mainTitle" style="color: var(--primary-color);">Talking Ben</h2>
            <p id="subTitle" style="font-size: 13px; color: #777; margin-bottom: 5px;">Ben bilan muloqot qiling yoki laboratoriyaga o'ting!</p>

            <!-- Ben -->
            <div id="benAvatar" class="ben-avatar-container">
                <div class="ben-face">
                    <div class="ben-ear left"></div>
                    <div class="ben-ear right"></div>
                    <div class="ben-eye left"><div class="ben-pupil" id="pupilLeft"></div></div>
                    <div class="ben-eye right"><div class="ben-pupil" id="pupilRight"></div></div>
                    <div class="ben-nose"></div>
                    <div class="ben-mouth" id="benMouth"></div>
                </div>
            </div>

            <!-- Ben javob berish ekrani -->
            <div id="chatBubble" class="bubble-chat">Ben uxlamoqda... 💤</div>

            <!-- LABORATORIYA ELEMENTLARI (Idishlar bosilganda ishlaydi) -->
            <div id="labArea" class="lab-flask-area" style="display: none;">
                <svg class="flask" onclick="mixChemical('Qizil')" viewBox="0 0 30 40"><path d="M12,5 L18,5 L18,12 L26,32 A4,4 0 0,1 22,37 L8,37 A4,4 0 0,1 4,32 L12,12 Z" fill="#e74c3c"/></svg>
                <svg class="flask" onclick="mixChemical('Ko\'k')" viewBox="0 0 30 40"><path d="M12,5 L18,5 L18,12 L26,32 A4,4 0 0,1 22,37 L8,37 A4,4 0 0,1 4,32 L12,12 Z" fill="#3498db"/></svg>
                <svg class="flask" onclick="mixChemical('Yashil')" viewBox="0 0 30 40"><path d="M12,5 L18,5 L18,12 L26,32 A4,4 0 0,1 22,37 L8,37 A4,4 0 0,1 4,32 L12,12 Z" fill="#2ecc71"/></svg>
            </div>

            <!-- Boshqaruv tugmalari (To'liq ishchi holatda) -->
            <div class="controls-grid">
                <button class="btn btn-lab" id="toggleLabBtn" onclick="toggleLaboratory()">Laboratoriya 🧪</button>
                <button class="btn btn-accent" onclick="triggerBenAction('Eugh')">Yegulik berish 🍗</button>
                <button class="btn" onclick="triggerBenAction('Hahaha')">Kulgini ko'rish 😂</button>
                <button class="btn btn-accent" onclick="askBenRandomly()">Tasodifiy Telefon ☎️</button>
            </div>

            <!-- SAVOL BERISH JOYI -->
            <div class="input-box">
                <input type="text" id="userInput" placeholder="Ben-ga savol bering (Masalan: Ertaga yomg'ir yog'adimi?)" onkeypress="checkEnter(event)">
                <button class="btn" onclick="askBenQuestion()">So'rash</button>
            </div>
        </div>

        <!-- ADMIN PANEL (Yashirin rejim) -->
        <div id="adminView" class="admin-card">
